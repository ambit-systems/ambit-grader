[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ambit-grader"
version = "0.2.0"
description = "Grades what execution evidence can and cannot prove about who authorised an action"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Ambit Systems" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
keywords = ["audit", "authorisation", "evidence", "agents", "governance", "DEMM"]
# Zero runtime dependencies by design. The grader is a trust object. Its
# supply-chain surface is the Python standard library only.
dependencies = []

[project.urls]
Homepage = "https://ambit-systems.com/"
Documentation = "https://docs.ambit-systems.com/verify/grade-your-traces/"
Source = "https://github.com/ambit-systems/ambit-grader"
Changelog = "https://github.com/ambit-systems/ambit-grader/blob/main/CHANGELOG.md"

[project.scripts]
ambit-grade = "ambit_grader.cli:main"

[project.optional-dependencies]
dev = [
  "mypy==1.19.1",
  "pytest>=8.0",
  "ruff==0.15.2",
  "pre-commit>=3.8",
  "vulture>=2.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RUF", "D", "ANN",
]
ignore = [
  "B008", "ANN401", "D105", "D107",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "C408", "PTH", "RUF043", "RUF059", "N801"]
"**/__init__.py" = ["D104"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unused_ignores = true
warn_return_any = true
warn_redundant_casts = true
strict_equality = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disable_error_code = ["import-untyped"]

# Tests are the behaviour lock, not public API. mypy checks them for real
# errors but does not demand annotations, matching the ruff ANN waiver.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
check_untyped_defs = true
disable_error_code = ["no-untyped-call"]

[tool.hatch.build.targets.sdist]
include = [
  "src/ambit_grader/**",
  "tests/**",
  "/README.md",
  "/CHANGELOG.md",
  "/SECURITY.md",
  "/LICENSE",
  "/NOTICE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ambit_grader"]